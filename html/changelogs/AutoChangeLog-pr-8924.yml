author: "Ollanius"
delete-after: True
changes:
  - bugfix: "Iron Pigfaces and Bascinets now have their proper unreversed naming schemes, just like their Steel variants."
  - bugfix: "Fixes an errant capitalization on 'cooling backpack'."
  - bugfix: "Dwarven bodytypes can now wear Grenzelhoftian boots, Freifechter boots, and Freifechter pants."
  - bugfix: "Tabis can now be worn by both men and women."
  - bugfix: "Morphing elixirs that can potentially delete items now have a warning in their description. This is only notable towards the types that can alter storage-centric equipment, such as belts and satchels."
  - bugfix: "Plackarts no longer mysteriously obscure one's uncovered chest and crotch."
  - rscadd: "Detailing support for decorated armor, allowing for the steel to be colored independantly from the golden trim."
  - rscadd: "Belted backpacks and shaded hats, as Donator-specific items. Note that belted backpacks, despite the name, do not actually go on the belt; they're just a reskin."
  - rscadd: "Plackarts can now be morphed from studded- and heavy leather armorpieces, alongside steel- and fluted halfplate."
  - rscadd: "Elegant Stechers and Winged Spears, morphed from Stechers and Enduring Spears via the 'Elegant Armory' Morphing Elixir."
  - rscadd: "Donator-specific greatcoats, coming in both dyeable and leatherspun variants. RMBing allows them to be worn more loosely around the shoulders."
  - rscadd: "The Inquisitor's longcoat can now be attached to an Ordinator's set of plate armor."
  - rscadd: "Scabbard support for Lagomorphica's and Stalkerino's swords."
  - rscadd: "CKEY-locked donator items to Naman, Terrydactal, DRD, Lizzy, and Sanshoom."
  - rscadd: "Standalone Shieldcrest variant for orles."